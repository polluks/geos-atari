# GEOS BBC Micro kernel linker configuration
# ROM at $8000-$BFFF (16KB sideways ROM)
# Screen buffer at $3000 (8000 bytes for 320x200x1)
# BSS variables at $5800

MEMORY {
    ROM:        start = $8000, size = $4000, file = %O;
    SCREEN:     start = $3000, size = $2000, define = yes;
    VARS:       start = $5800, size = $2000, define = yes;
    APP_RAM:    start = $0400, size = $2C00, define = yes;
}

SEGMENTS {
    rom_header:     load = ROM,    type = ro;
    jumptab:        load = ROM,    type = ro,    start = $8100;
    start:          load = ROM,    type = ro;

    hw1b:           load = ROM,    type = ro;
    init1:          load = ROM,    type = ro;
    init2:          load = ROM,    type = ro;
    init4:          load = ROM,    type = ro;
    irq:            load = ROM,    type = ro;

    mainloop1:      load = ROM,    type = ro;
